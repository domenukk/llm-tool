name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Hygiene checks
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/lint_hygiene.py

      - name: Hygiene linter tests
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tests -p "test_*.py"

      - name: Test
        run: cargo test --workspace --locked

      - name: Check no_std (core crate)
        run: cargo check -p llm-tool --no-default-features --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'ubuntu-latest' && 'thumbv7em-none-eabihf' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy no_std (core crate)
        run: cargo clippy -p llm-tool --no-default-features --locked -- -D warnings

      - name: Build no_std (thumbv7em-none-eabihf)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p llm-tool --no-default-features --locked --target thumbv7em-none-eabihf

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  doc:
    name: Documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps --locked
