[package]
name = "llm-tool-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for llm-tool (#[llm_tool] attribute)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "tool", "proc-macro", "function-calling", "agent"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
default = []
# Enables compile-time template parsing for `description_file = "..."` attributes.
md-tmpl = ["dep:md-tmpl", "dep:hashbrown"]

[dependencies]
md-tmpl = { version = "0.9.3", optional = true }
hashbrown = { version = "0.17", optional = true }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
convert_case = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
