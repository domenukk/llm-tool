[package]
name = "llm-tool-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for llm-tool (#[llm_tool] attribute)"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "tool", "proc-macro", "function-calling", "agent"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
default = []
# Backwards-compatible no-op feature alias (`md-tmpl` support is always enabled).
md-tmpl = []

[dependencies]
md-tmpl = { version = "0.10.3" }
hashbrown = { version = "0.17" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
convert_case = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
