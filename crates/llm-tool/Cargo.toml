[package]
name = "llm-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Framework-agnostic Rust tool definitions for LLM agents"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "tool", "agent", "function-calling"]
categories = ["api-bindings"]

[features]
default = ["std"]
std = [
  "serde_json/std",
  "serde/std",
  "schemars/std",
  "hashbrown/default",
  "md-tmpl/std",
]
# Backwards-compatible no-op feature alias (`md-tmpl` support is always enabled).
md-tmpl = []

[dependencies]
llm-tool-macros = { path = "../llm-tool-macros", version = "0.10.5" }
md-tmpl-core = { version = "0.10.6", default-features = false }
md-tmpl = { version = "0.10.6", default-features = false, features = ["serde"] }
md-tmpl-macros = { version = "0.10.6", default-features = false, features = [
  "serde",
] }
hashbrown = { version = "0.17", default-features = false, features = [
  "allocator-api2",
  "default-hasher",
  "serde",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "alloc",
] }
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
spin = { version = "0.12", default-features = false, features = [
  "rwlock",
  "lazy",
] }
tracing = { version = "0.1", default-features = false }
typed-builder = { version = "0.23" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs"] }
tempfile = "3"
futures = "0.3"
trybuild = "1"

[lints]
workspace = true
