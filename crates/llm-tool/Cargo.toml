[package]
name = "llm-tool"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Framework-agnostic Rust tool definitions for LLM agents"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/domenukk/llm-tool"
readme = "README.md"
keywords = ["llm", "tool", "agent", "function-calling"]
categories = ["api-bindings"]

[features]
default = ["std"]
std = [
  "serde_json/std",
  "serde/std",
  "schemars/std",
  "hashbrown/default",
  "md-tmpl?/std",
]
# Enable `#[llm_tool(prompt_file = "path.tmpl.md")]` or
# `#[llm_tool(response_file = "path.tmpl.md")]` for template-based
# tool descriptions and response rendering. Requires `md-tmpl`
# as a direct dependency for runtime context types (`Context`, `Template`).
md-tmpl = [
  "dep:md-tmpl",
  "dep:md-tmpl-macros",
  "llm-tool-macros/md-tmpl",
  "llm-tool-macros/prompt-templates",
  "prompt-templates",
]
prompt-templates = [
  "dep:md-tmpl",
  "dep:md-tmpl-macros",
  "llm-tool-macros/md-tmpl",
  "llm-tool-macros/prompt-templates",
  "md-tmpl",
]

[dependencies]
llm-tool-macros = { path = "../llm-tool-macros", version = "0.4.0" }
md-tmpl = { version = "0.4.0", optional = true, default-features = false, features = [
  "serde",
] }
md-tmpl-macros = { version = "0.4.0", optional = true, default-features = false, features = [
  "serde",
] }
hashbrown = { version = "0.17", default-features = false, features = [
  "allocator-api2",
  "default-hasher",
] }
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
spin = { version = "0.12", default-features = false, features = [
  "rwlock",
  "lazy",
] }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs"] }
tempfile = "3"
futures = "0.3"
trybuild = "1"

[lints]
workspace = true
