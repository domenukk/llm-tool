[package]
name = "llm-tool-mcp"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Model Context Protocol (MCP) server integration for llm-tool registries"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/domenukk/llm-tool"
readme = "README.md"
keywords = ["llm", "mcp", "tool", "agent", "function-calling"]
categories = ["api-bindings"]

[features]
default = []
md-tmpl = ["llm-tool/md-tmpl"]

[dependencies]
llm-tool = { path = "../llm-tool", version = "0.4.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "net"] }
tracing = "0.1"

[dev-dependencies]
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
tempfile = "3"

[lints]
workspace = true
