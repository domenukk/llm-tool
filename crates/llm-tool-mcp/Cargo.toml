[package]
name = "llm-tool-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Model Context Protocol (MCP) server integration for llm-tool registries"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["llm", "mcp", "tool", "agent", "function-calling"]
categories = ["api-bindings"]

[features]
default = []
md-tmpl = ["llm-tool/md-tmpl"]

[dependencies]
llm-tool = { path = "../llm-tool", version = "0.9.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "net",
] }
tracing = "0.1"

[dev-dependencies]
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }
tempfile = "3"
rmcp = { version = "2.0.0", features = [
  "client",
  "transport-async-rw",
  "transport-child-process",
] }

[lints]
workspace = true
